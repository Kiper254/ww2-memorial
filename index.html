<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pamięć Ofiar II Wojny Światowej</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 30px 0;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .country-btn {
            background: white;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .country-btn:hover {
            background: #333;
            color: white;
        }

        footer {
            margin-top: 60px;
            padding: 30px;
            background: #ddd;
        }

        .criminals-link {
            display: inline-block;
            padding: 15px 25px;
            background: #b30000;
            color: white;
            font-size: 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }

        .criminals-link:hover {
            background: #7a0000;
        }
    </style>
</head>
